apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonLabels:
  env: staging
nameSuffix: -staging
configMapGenerator:
- name: spring-petclinic
  env: ./staging-environment
patches:
  - path: change-cause.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: spring-petclinic
